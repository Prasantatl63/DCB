apiVersion: batch/v1
kind: Job
metadata:
  name: dcb-playwright
spec:
  completions: 3
  parallelism: 3
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: dcb-playwright
    spec:
      restartPolicy: Never
      containers:
        - name: dcb-test
          image: dcb:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
